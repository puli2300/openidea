name: build-windows

# Temporary workflow for testing the fix in this fork: builds the Windows installer
# (NSIS + MSI) on a GitHub-hosted Windows runner and uploads it as an artifact.
on:
  push:
    branches: [fix/huge-variable-collections]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      # The official updater pubkey needs its private key to sign update artifacts;
      # a fork has no such key, so build installers without updater artifacts.
      - run: pnpm tauri build --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: openidea-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/openidea.exe
          if-no-files-found: error
